spring.application.name=food-ordering-system

# Default: in-memory H2 so the app runs with zero setup.
# For MySQL run with:  -Dspring-boot.run.profiles=mysql  (see application-mysql.properties)
spring.datasource.url=jdbc:h2:mem:food_ordering_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080
server.shutdown=graceful
server.compression.enabled=true
# API errors are produced by GlobalExceptionHandler; never leak internals via the default error page.
server.error.include-message=never
server.error.include-stacktrace=never

# Logging
logging.level.root=INFO
logging.level.com.example.demo=INFO

# Actuator: only the health endpoint is exposed (GET /actuator/health)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Billing rules
app.billing.tax-rate=0.05
app.billing.discount-threshold=500
app.billing.discount-rate=0.10
